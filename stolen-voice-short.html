function poly(points,color){

  const crossings=[],scan=row+0.5;

function changeRoom(nextRoom){
 if(!Number.isInteger(nextRoom)||nextRoom<0||nextRoom>=rooms.length)return;
 stopWalking();room=nextRoom;
 player={x:nextRoom===1?42:155,y:188,step:1,facing:'front'};

function movePlayer(dx,dy){
 if(!playing||popupOpen||menuOpen)return;
 const nextX=Math.max(12,Math.min(308,player.x+dx));
 const nextY=Math.max(walkFloors[room],Math.min(220,player.y+dy));
 player.facing=dx<0?'left':dx>0?'right':dy<0?'back':'front';
 if(nextX===player.x&&nextY===player.y){draw();return}
 player.x=nextX;player.y=nextY;
 // Keep this exact cel when movement stops; no delayed idle pose swap.
 player.step++;
 draw();
}
function norm(t){return t.toLowerCase().replace(/[.,!?'"]/g,'').replace(/\s+/g,' ').trim()}
function command(raw){
 const t=norm(raw);if(!t||!playing||popupOpen)return;
 const contains=(text,phrase)=>(' '+text+' ').includes(' '+phrase+' ');
 const word=(...names)=>names.some(name=>contains(t,name));
 const noun=text=>text.replace(/\b(?:the|a|an)\s+/g,'').trim();
 const isMan=text=>['man','old man','person','guy','fellow','gardener','old gardener','merrin'].includes(noun(text));
 const isRose=text=>['rose','flower','rose stem','stem'].includes(noun(text));
 const isBell=text=>['bell','garden bell','silver bell'].includes(noun(text));
 const isClapper=text=>['clapper','silver clapper','bell clapper'].includes(noun(text));
 const isMirror=text=>['mirror','glass','royal mirror','enchanted mirror'].includes(noun(text));
 const isBook=text=>['book','old book','volume','almanac','spellbook','book of enchantments'].includes(noun(text));
 if(/^(?:help|hint|what can i do)$/.test(t)){say(helpText());return}
 if(/^(?:save|save game)$/.test(t)){saveGame();return}
 if(/^(?:restore|load|restore game|load game)$/.test(t)){restoreGame();return}
 if(/^(?:inventory|inv|i|i have)$/.test(t)){say(inv.length?'You carry: '+inv.join(', ')+'.':'Your satchel is empty.');return}
 const read=t.match(/^read(?:\s+(.*))?$/);
 if(read){
  if(room===1&&(!read[1]||isBook(read[1]))){flags.readBook=true;say('The Book of Enchantments reads:\n"Speak the owner\'s name over a silver note, and the glass must return what it borrowed."')}
  else say('You do not see a book here.');return;
 }
 const look=t.match(/^(?:look(?:\s+at)?|examine|inspect|l|x)(?:\s+(.*))?$/);
 if(look){
  const subject=noun(look[1]||'');const looking=(...names)=>names.includes(subject);
  if(isMan(subject))say(room!==0?'Merrin is outside in the garden.':flags.voiceReturned?'Merrin pats his throat and smiles. His voice has come home. You should talk to him.':'Merrin, the old gardener, opens his mouth to greet you. A tiny bell chimes instead of words! He points at his throat, then toward the castle mirror.');
  else if(looking('me','myself','self','elara','princess','woman','girl'))say('You are Princess Elara of Alderwick. A stolen voice seems a perfectly good reason to interrupt your afternoon walk.');
  else if(has('rose')&&isRose(subject))say('The rose has a long, stiff stem, just thin enough to slip inside the little garden bell.');
  else if(has('bell clapper')&&isClapper(subject))say('A tiny silver clapper rests in your satchel. Its clear note should carry through enchanted glass.');
  else if(room===0&&(isBell(subject)||looking('post','bell post')))say(flags.bell?'The bell hangs quietly on its post. You have rescued its loose silver clapper.':'A loose silver clapper is caught inside the bell. Your fingers are too large to reach it; something long and thin might work.');
  else if(room===0&&isRose(subject))say('A rose grows beside the path, its bright petals balanced on a long, stiff stem.');
  else if(room===0&&looking('castle','towers','tower','wall','walls','alderwick','gate','gateway','door','entrance','bridge','drawbridge'))say('The drawbridge leads into Alderwick\'s castle. The enchanted mirror is in the gallery just beyond the gate.');
  else if(room===0&&looking('water','moat'))say('Blue water laps against the castle walls beneath the drawbridge.');
  else if(room===0&&looking('tree','trees','oak','woods','forest'))say('Green trees frame the garden. Even the birds seem puzzled by Merrin\'s new bell-like greeting.');
  else if(room===0&&looking('garden','grass','lawn','path','road','ground','sky','clouds'))say('The sunny royal garden lies before the castle. Merrin stands near a rose and the little bell.');
  else if(room===1&&isMirror(subject))say(flags.voiceReturned?'The mirror is still. Merrin\'s voice has flown back to the garden.':flags.mirrorAwake?'Silver ripples dance across the glass. Somewhere inside, a man\'s voice whispers, "Who calls me?"':'Silver mist swirls behind the mirror. You can almost hear a familiar voice, but the glass refuses to listen.');
  else if(room===1&&isBook(subject))say('The Book of Enchantments lies open on the table. Try READ BOOK.');
  else if(room===1&&looking('table','desk'))say('A wooden table holds the Book of Enchantments. Its open page shows a little silver bell.');
  else if(room===1&&looking('chair','seat'))say('A high-backed purple chair stands beside the wall. It has wisely kept its opinions to itself.');
  else if(room===1&&looking('candle','candles','sconce','sconces'))say('Quiet candles light the gallery and its troublesome mirror.');
  else if(looking('','around','room','surroundings','here','screen'))say(room===0?'Merrin stands speechless in the royal garden. A rose grows near the little bell, and the castle gallery lies across the drawbridge.':'A gilt mirror hangs in the quiet gallery. The Book of Enchantments rests on a table; the garden is outside.');
  else say('You do not see that here. Type LOOK to survey your surroundings.');return;
 }
 const take=t.match(/^(?:take|get|pick(?:\s+up)?)\s+(.+)$/);
 if(take){
  const target=noun(take[1]);
  if(isRose(target)){
   if(has('rose'))say('The rose is already in your satchel.');
   else if(room!==0)say('The rose grows outside in the garden.');
   else{flags.rose=true;add('rose');award('rose',5);say('You pick the rose carefully, keeping its long stem intact.')}
  }else if(isClapper(target))say(has('bell clapper')?'You already have the silver clapper.':room===0?'The clapper is caught inside the bell. You need something thin to reach it.':'There is no loose clapper here.');
  else if(room===0&&isBell(target))say('The bell is fixed to its post. Its loose clapper is the part you need.');
  else if(room===1&&isBook(target))say('The heavy book is chained to the table. You can READ BOOK without carrying it.');
  else say('You cannot take that here.');draw();return;
 }
 const use=t.match(/^(?:use|put|place|touch|strike)\s+(.+?)\s+(?:on|in|into|to|against|with)\s+(.+)$/);
 const ring=t.match(/^ring(?:\s+(.+?))?(?:\s+with\s+(.+))?$/);
 if(use||ring){
  const item=noun(use?use[1]:ring[2]||'clapper'),target=noun(use?use[2]:ring[1]||'bell');
  if(isRose(item)&&isBell(target)){
   if(room!==0)say('The garden bell is outside.');
   else if(flags.bell)say('You have already rescued the clapper.');
   else if(!has('rose'))say('You need to pick the rose before you can use its stem.');
   else{flags.bell=true;add('bell clapper');award('clapper',5);say('You slip the rose stem inside the bell and hook the loose silver clapper. It drops into your palm with a bright little note!')}
  }else if((isClapper(item)||isBell(item))&&isMirror(target)){
   if(room!==1)say('The enchanted mirror is inside the gallery.');
   else if(!has('bell clapper'))say('You need the silver clapper caught inside the garden bell.');
   else if(flags.voiceReturned)say('The mirror has already returned Merrin\'s voice.');
   else{flags.mirrorAwake=true;say('You sound a clear silver note against the mirror. The mist trembles. A voice behind the glass asks, "Who calls me?"')}
  }else if(isClapper(item)&&isBell(target))say(!has('bell clapper')?'The clapper is still caught inside the garden bell.':'A sweet silver note rings out. The mirror may be a better place to try that.');
  else say('That does not work here. Try LOOK at the object for a clue.');draw();return;
 }
 const speaking=t.match(/^(?:say|speak|call|shout)\s+(?:the name\s+)?(.+)$/);
 if(speaking&&(!/^speak\s+(?:to|with)\s/.test(t))){
  const name=noun(speaking[1]);
  if(name!=='merrin')say('Your words echo softly. The book asks for the name of the person whose voice was stolen.');
  else if(flags.voiceReturned)say('Merrin already has his voice back. Return to the garden and talk to him.');
  else if(room!==1)say('You say Merrin\'s name, but the enchanted mirror is inside the gallery.');
  else if(!flags.mirrorAwake)say('The glass stays silent. First sound a silver note against the mirror.');
  else{flags.voiceReturned=true;award('voice',5);say('"Merrin!" you call. The glass flashes, and a warm voice bursts free: "About time!" It flies through the doorway toward the garden.')}
  draw();return;
 }
 const talk=t.match(/^(?:talk|speak)(?:\s+(?:to|with))?(?:\s+(.+))?$/);
 if(talk){
  const target=noun(talk[1]||'');
  if((!target||isMan(target))&&room===0){
   if(flags.voiceReturned)finishGame();
   else say('Merrin tries to answer. "Ding!" He sighs, points at the castle, and mouths his own name: M-e-r-r-i-n.');
  }else if(room===1&&isMirror(target))say(flags.mirrorAwake?'The voice whispers, "Tell me whose voice I am."':'Only a faint murmur answers. The glass is not listening yet.');
  else say('There is no one here to answer you.');return;
 }
 const go=t.match(/^(?:go(?:\s+to)?|enter|walk(?:\s+to)?|leave|exit)(?:\s+(.+))?$/);
 const destination=noun(go?go[1]||'out':t);
 if(go||['north','south','n','s','castle','gallery','garden','outside','out','return'].includes(destination)){
  if(room===0&&['gallery','castle','north','n','gate','door','inside','mirror'].includes(destination)){
   changeRoom(1);say('You cross the drawbridge and enter the mirror gallery. A voice murmurs behind the misted glass.');
  }else if(room===1&&['garden','outside','out','south','s','back','return'].includes(destination)){
   changeRoom(0);say(flags.voiceReturned?'Merrin is patting his throat in amazement. His voice has come home!':'You return to the garden. Merrin gives you a hopeful, silent wave.');
  }else if(room===1&&isMirror(destination))say('The mirror holds a stolen voice. It is not a doorway.');
  else say('That way is closed. The garden and mirror gallery are the places to investigate.');return;
 }
 say('Try LOOK at something, TALK TO MAN, TAKE FLOWER, USE an item ON something, READ BOOK, or SAY a name.');
}
const history=[];
let historyIndex=0,historyDraft='';
document.querySelector('#form').addEventListener('submit',event=>{
 event.preventDefault();
 const text=input.value.trim();
 if(text){history.push(text);if(history.length>50)history.shift()}
 historyIndex=history.length;historyDraft='';input.value='';selected='';renderItems();
 stopWalking();command(text);draw();
 if(playing&&!popupOpen)c.focus();
});
// Original-style keyboard menus and walking: no permanent button panels.
let menuOpen=false,menuColumn=0,menuRow=0,walkDirection=null,walkTimer=0;
const menuLayer=document.querySelector('#agi-menu');
const instructions='ARROW KEYS: start walking.\nPress the same arrow to stop.\n\nType a command, then ENTER.\nTAB: inventory. ESC: menus.\nF2: sound on/off.\nF3: repeat your last command.\nF5: save. F7: restore.';
const menus=[
 {name:'Game',x:8,items:[['Save game  F5',()=>saveGame()],['Restore    F7',()=>restoreGame()],['Sound      F2',()=>toggleSound()],['Resume',()=>c.focus()]]},
 {name:'Action',x:72,items:[['Inventory TAB',()=>command('inventory')],['Look around',()=>command('look')],['Talk',()=>command('talk')]]},
 {name:'Help',x:152,items:[['Instructions',()=>say(instructions)],['Hint',()=>command('help')]]}
];
function paintMenu(){
 const canvas=document.querySelector('#agi-menu-picture'),context=canvas.getContext('2d');
 context.clearRect(0,0,320,200);context.fillStyle='#ffffff';context.fillRect(0,0,320,8);
 menus.forEach((menu,index)=>{
  if(index===menuColumn){context.fillStyle='#000000';context.fillRect(menu.x-4,0,menu.name.length*8+8,8)}
  blitText(context,menu.name,menu.x,0,index===menuColumn?'#ffffff':'#000000');
 });
 const menu=menus[menuColumn],left=menu.x-4,width=Math.max(...menu.items.map(item=>item[0].length))*8+16,height=menu.items.length*8+8;
 context.fillStyle='#ffffff';context.fillRect(left,9,width,height);
 context.fillStyle='#aa0000';context.fillRect(left,9,width,1);context.fillRect(left,9+height-1,width,1);context.fillRect(left,9,1,height);context.fillRect(left+width-1,9,1,height);
 menu.items.forEach(([label],index)=>{
  if(index===menuRow){context.fillStyle='#000000';context.fillRect(left+4,13+index*8,width-8,8)}
  blitText(context,label,left+8,13+index*8,index===menuRow?'#ffffff':'#000000');
 });
 document.querySelector('#agi-menu-description').textContent=menu.name+': '+menu.items[menuRow][0]+'. Use arrow keys and Enter. Escape closes the menu.';
}
function closeMenu(){menuOpen=false;menuLayer.hidden=true;document.querySelector('.hud').inert=!playing;c.focus()}
function openMenu(){stopWalking();menuOpen=true;menuColumn=0;menuRow=0;menuLayer.hidden=false;document.querySelector('.hud').inert=true;paintMenu();menuLayer.focus()}
menuLayer.addEventListener('click',()=>closeMenu());
const moveSteps={up:[0,-3],down:[0,3],left:[-5,0],right:[5,0],nw:[-4,-2],ne:[4,-2],sw:[-4,2],se:[4,2]};
walkStops.add(()=>{walkDirection=null;if(walkTimer){clearInterval(walkTimer);walkTimer=0}});
function walkTick(){
 if(!walkDirection||!playing||popupOpen||menuOpen){stopWalking();return}
 const oldX=player.x,oldY=player.y;
 movePlayer(...moveSteps[walkDirection]);
 if(player.x===oldX&&player.y===oldY)stopWalking();
}
function toggleWalk(direction){
 if(walkDirection===direction){stopWalking();return}
 stopWalking();walkDirection=direction;walkTick();
 if(walkDirection)walkTimer=setInterval(walkTick,110);
}
window.addEventListener('blur',()=>{stopWalking();if(menuOpen)closeMenu()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopWalking();if(menuOpen)closeMenu()}});
function startBackgroundAnimation(){
 const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(!animationTimer&&!reduceMotion)animationTimer=setInterval(()=>{if(!popupOpen&&!menuOpen){animationFrame=(animationFrame+1)%6;draw()}},360);
}
document.querySelector('#start').onclick=()=>{
 playOpeningJingle();
 document.querySelector('#intro').remove();introSequence=true;
 introPages=[
  'Merrin opens his mouth to greet you. A tiny bell chimes instead of words! He points at his throat, then toward the enchanted mirror inside the castle.',
  'Use the arrow keys to walk.\nPress the same arrow to stop.\n\nType what you want Elara to do, then press ENTER.',
  'F1: instructions. TAB: inventory.\nF2: sound on/off.\nF5: save. F7: restore.\nESC: menus.\n\nYour adventure begins!'
 ];
 say(introPages.shift());
};
input.addEventListener('input',()=>{stopWalking();draw()});
document.addEventListener('keydown',event=>{
 if(event.isComposing||event.ctrlKey||event.metaKey||event.altKey)return;
 if(document.querySelector('#intro')){
  if(event.key==='Tab'){event.preventDefault();document.querySelector('#start').focus()}
  else if(event.key==='Enter'&&event.target!==document.querySelector('#start')){event.preventDefault();document.querySelector('#start').click()}
  return;
 }
 const ending=document.querySelector('.screen>.overlay[aria-modal="true"]');
 if(ending){
  event.preventDefault();
  if(['Enter',' '].includes(event.key)&&!event.repeat)location.reload();
  else ending.focus();
  return;
 }
 if(menuOpen){
  event.preventDefault();if(event.repeat)return;
  if(event.key==='Escape'){closeMenu();return}
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){menuColumn=(menuColumn+(event.key==='ArrowLeft'?-1:1)+menus.length)%menus.length;menuRow=0}
  else if(event.key==='ArrowUp'||event.key==='ArrowDown')menuRow=(menuRow+(event.key==='ArrowUp'?-1:1)+menus[menuColumn].items.length)%menus[menuColumn].items.length;
  else if(event.key==='Enter'){const action=menus[menuColumn].items[menuRow][1];closeMenu();action();return}
  paintMenu();return;
 }
 if(!playing||popupOpen)return;
 if(event.key==='F1'){event.preventDefault();stopWalking();say(instructions);return}
 if(event.key==='F5'){event.preventDefault();saveGame();return}
 if(event.key==='F7'){event.preventDefault();restoreGame();return}
 if(event.key==='Tab'){event.preventDefault();command('inventory');return}
 if(event.key==='F3'){
  event.preventDefault();stopWalking();input.value=history.at(-1)||'';input.focus();input.setSelectionRange(input.value.length,input.value.length);draw();return;
 }
 if(event.key==='Escape'){
  event.preventDefault();openMenu();return;
 }
 const direction={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Home:'nw',PageUp:'ne',End:'sw',PageDown:'se'}[event.key]||
  {Numpad1:'sw',Numpad2:'down',Numpad3:'se',Numpad4:'left',Numpad6:'right',Numpad7:'nw',Numpad8:'up',Numpad9:'ne'}[event.code];
 if(direction){event.preventDefault();if(!event.repeat)toggleWalk(direction);c.focus();return}
 if(event.code==='Numpad5'){event.preventDefault();stopWalking();return}
 if(event.key==='Enter'&&event.target!==input){
  event.preventDefault();stopWalking();
  if(input.value.trim())document.querySelector('#form').requestSubmit();else input.focus();
  return;
 }
 if(event.target===input||event.target?.isContentEditable)return;
 if(event.key.length===1||event.key==='Backspace'){
  event.preventDefault();stopWalking();
  input.value=(event.key==='Backspace'?input.value.slice(0,-1):input.value+event.key).slice(0,38);
  input.focus();input.setSelectionRange(input.value.length,input.value.length);draw();
 }
});
paintTextWindow('ELARA AND THE STOLEN VOICE\n\nA Alderwick adventure\n\nPress Enter to begin.',document.querySelector('#intro-picture'),document.querySelector('#start'));
document.querySelector('#start').focus();draw();
})();
</script></body></html>
