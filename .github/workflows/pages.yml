name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Prepare the current standalone game
        run: |
          mkdir -p _site
          cp stolen-voice.html _site/index.html
          cp stolen-voice.html _site/stolen-voice.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload playable game
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
